# root-context.xml 의 property-placeholder 가 읽는다. Java 에서는 @Value("${app.naver.client-id}") 로 사용.

# 네이버 지도 JS API v3 Client ID (ncpKeyId).
# 네이버 클라우드 콘솔 > Web 서비스 URL 에 http://localhost:8080 등록 필요.
# SDK: https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=<client-id>
# 주의: 'qttr0pq1es' 의 5번째 글자는 숫자 0 (영문 O 아님). 영문 O 로 쓰면 SDK 가 500 / 인증 실패를 돌려준다.
app.naver.client-id=qttr0pq1es

# 취약 점수 기준점(100점 만점). 이 점수 이상인 건물만 마커로 표시
app.analysis.score-min=80

# 모바일 앱 현장 사진 저장 폴더 (비우면 [사용자 홈]/itgeo-upload). 예: C:/itgeo-upload
app.upload.dir=

app.tmap.app-key=aTYiHKjDx93j1KF2hiJa59NBqG3gUYH2GJpmLil2

# 브이월드 인증키 (건물 3D · 건물 외곽선). MapController 가 map.jsp 로 넘기고 resources/vworld3d/bld3d-frame.html 이 받아 쓴다.
# 브이월드 콘솔에서 서비스 URL(http://localhost:8080)을 등록한 키만 동작한다.
app.vworld.api-key=0D3C160C-825C-4C22-83FB-3A0FD69AA0AE

# 데이터 업데이트 배치 서버(Python FastAPI, reference/pipeline/api.py) 주소. DataUpdateService 가 읽는다.
batch.url=http://localhost:8000
